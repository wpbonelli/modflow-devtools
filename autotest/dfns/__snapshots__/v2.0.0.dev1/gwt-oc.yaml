  period:
    iper:
      shape: (nper)
      block: period
      description: integer value specifying the starting stress period number for which the data specified
        in the PERIOD block apply.  IPER must be less than or equal to NPER in the TDIS Package and greater
        than zero.  The IPER value assigned to a stress period block must be greater than the IPER value
        assigned for the previous PERIOD block.  The information specified in the PERIOD block will continue
        to apply for all subsequent stress periods, unless the program encounters another PERIOD block.
      block_variable: true
      reader: urword
      optional: false
      longname: stress period number
      type: integer
    saverecord:
      shape: (nper)
      block: period
      reader: urword
      optional: true
      type: record
      children:
        save:
          block: period
          description: keyword to indicate that information will be saved this stress period.
          reader: urword
          optional: false
          longname: keyword to save
          type: keyword
        rtype:
          block: period
          description: type of information to save or print.  Can be BUDGET or CONCENTRATION.
          reader: urword
          optional: false
          longname: record type
          type: string
        ocsetting:
          block: period
          description: specifies the steps for which the data will be saved.
          reader: urword
          type: union
          children:
            all:
              block: period
              description: keyword to indicate save for all time steps in period.
              reader: urword
              type: keyword
            first:
              block: period
              description: keyword to indicate save for first step in period. This keyword may be used
                in conjunction with other keywords to print or save results for multiple time steps.
              reader: urword
              type: keyword
            last:
              block: period
              description: keyword to indicate save for last step in period. This keyword may be used
                in conjunction with other keywords to print or save results for multiple time steps.
              reader: urword
              type: keyword
            frequency:
              block: period
              description: save at the specified time step frequency. This keyword may be used in conjunction
                with other keywords to print or save results for multiple time steps.
              reader: urword
              type: integer
            steps:
              shape: (<nstp)
              block: period
              description: save for each step specified in STEPS. This keyword may be used in conjunction
                with other keywords to print or save results for multiple time steps.
              reader: urword
              type: integer
    save:
      shape: (nper)
      block: period
      description: keyword to indicate that information will be saved this stress period.
      reader: urword
      optional: false
      longname: keyword to save
      type: keyword
    printrecord:
